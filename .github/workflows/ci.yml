name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check all JS
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '^.claude/'); do
            echo "checking $f"
            node --check "$f"
          done
